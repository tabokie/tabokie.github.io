<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  {% include head.html %}
  <body class="snow hack">
    <script data-goatcounter="https://tabokie.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <div class="container">
      {% include navbar.html %}

      <div class="snowframe">
        <div class="grid">
          <div class="cell -3of12 content">
            <center>
            {% if page.avatar %}
            <img src="{{page.avatar}}" alt="My Avatar" class="avatar">
            {% endif %}
            <br />
            Reach me at <a href="mailto:xy.tao@outlook.com">xy.tao@outlook.com</a>,
            <br />
            also available on
            <br />
            <a href="https://github.com/tabokie">GitHub</a>, <a href="https://www.douban.com/people/91872582/">Douban</a>.
            </center>
          </div>
          <div class="cell -9of12 content">
            {{content}}
          </div>
        </div>
      </div>

      {% include footer.html %}
    </div>
    <script src="/assets/js/instantpage-3.0.0.js" defer type="module"> </script>
  </body>
</html>
